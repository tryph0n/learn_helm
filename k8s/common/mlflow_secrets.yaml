# MLFlow Kubernetes Secret - Reference/Documentation only
#
# This file is kept as a reference for the expected secret structure.
# DO NOT apply this file directly with kubectl apply.
#
# Instead, create the secret from the .env file at the project root:
#
#   kubectl create secret generic mlflow-env-variables --from-env-file=.env
#
# The .env file should contain the following keys:
#   PORT, BACKEND_STORE_URI, ARTIFACT_ROOT, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#
# To update an existing secret, delete it first then recreate:
#
#   kubectl delete secret mlflow-env-variables
#   kubectl create secret generic mlflow-env-variables --from-env-file=.env

apiVersion: v1
kind: Secret
metadata:
  name: mlflow-env-variables
stringData:
  PORT: "<from .env>"
  BACKEND_STORE_URI: "<from .env>"
  ARTIFACT_ROOT: "<from .env>"
  AWS_ACCESS_KEY_ID: "<from .env>"
  AWS_SECRET_ACCESS_KEY: "<from .env>"
