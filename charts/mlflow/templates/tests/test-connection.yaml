apiVersion: v1
kind: Pod
metadata:
  name: {{ include "mlflow.fullname" . }}-test-connection
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "mlflow.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: ["python", "-c"]
      args:
        - |
          import urllib.request

          url = "http://{{ include "mlflow.fullname" . }}:{{ .Values.service.port }}/health"
          with urllib.request.urlopen(url, timeout=10) as response:
              body = response.read().decode()
          if response.status != 200:
              raise SystemExit(f"GET {url}: HTTP {response.status}")
          print(f"GET {url}: HTTP {response.status} {body}")
